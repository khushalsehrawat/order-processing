spring.application.name=CoordinatorService

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/coordinator_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

services.order.url=${ORDER_SERVICE_URL:http://localhost:8081}
services.inventory.url=${INVENTORY_SERVICE_URL:http://localhost:8082}
services.payment.url=${PAYMENT_SERVICE_URL:http://localhost:8083}
services.shipping.url=${SHIPPING_SERVICE_URL:http://localhost:8084}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}

test.reset.enabled=${TEST_RESET_ENABLED:true}

coordinator.retry.max-attempts=3
coordinator.retry.initial-delay-ms=500
coordinator.request.timeout-seconds=5

coordinator.recovery.fixed-delay-ms=10000
coordinator.recovery.batch-size=50

coordinator.executor.core-pool-size=16
coordinator.executor.max-pool-size=32
coordinator.executor.queue-capacity=1000

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

server.error.include-message=always
server.error.include-binding-errors=always
